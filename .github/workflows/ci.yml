name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cityxplore
          POSTGRES_PASSWORD: cityxplore
          POSTGRES_DB: cityxplore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- BACKEND ----
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Backend checks (compile + tests)
        run: ./gradlew :backend:check --no-daemon

      # ---- CLIENT ----
      #      - name: Validate KMP client build
      #        run: ./gradlew :client:composeApp:assemble --no-daemon

      # ---- MIGRATIONS ----
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 'latest'

      - name: Login and link Supabase project
        run: |
          supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Validate SQL migrations syntax
        run: |
          echo "Checking Supabase migrations..."
          supabase --version
          supabase db lint --linked
