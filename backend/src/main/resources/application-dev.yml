spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cityxplore
    username: cityxplore
    password: cityxplore
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baselineOnMigrate: true
    locations: classpath:db/migration