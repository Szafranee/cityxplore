spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cityxplore
    username: cityxplore
    password: cityxplore
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
        autosave: conservative

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baselineOnMigrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:54321/auth/v1
          jwk-set-uri: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json

supabase:
  api-key: ${SUPABASE_ANON_KEY:}
  secret-key: ${SUPABASE_SERVICE_ROLE_KEY:}
