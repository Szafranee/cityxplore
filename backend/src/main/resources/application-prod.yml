spring:
  application:
    name: cityxplore-backend-prod

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json
          issuer-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1

  datasource:
    url: jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
        autosave: conservative

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    #        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: false

server:
  port: ${PORT:8080}

supabase:
  api-key: ${SUPABASE_PUBLISHABLE_KEY}
  secret-key: ${SUPABASE_SECRET_KEY}
  storage:
    url: https://${SUPABASE_PROJECT_REF}.supabase.co/storage/v1

logging:
  level:
    root: INFO
    org.flywaydb.core: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    diskspace:
      enabled: true
  info:
    env:
      enabled: false

app:
  admin:
    enable-reset: false
